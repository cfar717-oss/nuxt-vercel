# === CONFLICT RESOLUTION HIERARCHY ===
conflict_hierarchy:
  strategy_tier:
    authority: "highest"
    skills: ["strategic_copy_director", "offer_architect", "product_creation_genius"]
    rule: "Strategy decisions are binding unless compliance/ethics risk"

  execution_tier:
    authority: "medium"
    skills: ["sales_page_copywriter", "email_campaign_genius", "vsl_long_form", "vsl_short_form", "advertorial_copy_master"]
    rule: "Executes within strategy; may raise concerns but cannot override"

  refinement_tier:
    authority: "low"
    skills: ["human_persuasion_editor", "master_writing_partner"]
    rule: "Polish/consistency; cannot override strategy/structure"

# === SSOT REQUIREMENTS BY SKILL ===
ssot_requirements:
  always_require_project_brief:
    - "sales_page_copywriter"
    - "email_campaign_genius"
    - "vsl_long_form"
    - "advertorial_copy_master"
    - "product_creation_genius"
    - "master_monitoring_agent"

  always_require_message_spine:
    - "sales_page_copywriter"
    - "email_campaign_genius"
    - "vsl_long_form"
    - "strategic_copy_director"

  require_evidence_pack_if_claims:
    - "sales_page_copywriter"
    - "email_campaign_genius"
    - "vsl_long_form"
    - "advertorial_copy_master"
    - "human_persuasion_editor"

  require_voice_guide_if_multi_asset:
    - "strategic_copy_director"
    - "master_writing_partner"

# === VERSION COMPATIBILITY ===
