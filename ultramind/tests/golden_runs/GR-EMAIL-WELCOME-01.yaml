# GOLDEN RUN 01 — Email Welcome Sequence (Sleep Coaching)
# Canonical test case for Email Campaign Genius skill
# Scenario: Warm audience, info product, relationship-first welcome

GOLDEN_RUN:
  id: "GR-EMAIL-WELCOME-01"
  name: "Welcome Sequence — Sleep Coaching Info Product"

  # === METADATA ===
  skill_id: "email_campaign_genius"
  baseline_version: "1.0.0"
  baseline_date: "2025-12-18"
  scenario_type: "ideal"  # ideal | challenging
  audience_temp: "warm"   # cold | warm | hot

  # === INPUTS (Canonical — Do Not Modify) ===
  inputs:
    PROJECT_BRIEF:
      project_id: "SLEEP_COACH_2024"
      asset_id: "welcome_sequence_v1"
      version: "1.0"
      owner_agent: "email_campaign_genius"
      date: "2024-12-01"

      objective:
        primary_goal: "Orient new subscribers to brand + philosophy, build trust, deliver quick win, soft-introduce paid offer"
        success_metric: "Open rates >40%, click rates >8%, zero complaints/unsubscribes"

      avatar:
        primary_segment: "Exhausted professionals (30-50) who can't fall or stay asleep, tried pills/meditation apps, skeptical but hopeful"
        pains:
          - "Lying awake 2-3 hours nightly, mind racing"
          - "Waking 3-4am, can't get back to sleep"
          - "Groggy/irritable all day from poor sleep"
          - "Tried everything: pills (side effects), apps (don't work), sleep hygiene (inconsistent)"
        desires:
          - "Fall asleep within 20 minutes"
          - "Sleep through the night (or fall back asleep quickly)"
          - "Wake refreshed and energized"
          - "Natural solution without pills or perfect routines"
        sophistication_level: "aware"
        vocabulary:
          - "My brain won't shut off"
          - "I'm exhausted but wired"
          - "I dread bedtime"

      offer:
        name: "The Sleep Recalibration System"
        price: "$197"
        mechanism: "Sleep architecture reset via nervous system regulation (not sleep hygiene tips or apps)"
        differentiators:
          - "Addresses root cause (dysregulated nervous system) not symptoms"
          - "Works without pills, perfect routines, or meditation apps"
          - "Results in 7-14 days (not months of trial and error)"
        cta_primary: "Join the Sleep Recalibration System"
        cta_secondary: "Learn more about the system"

      nonnegotiables:
        claims_limits:
          - "No disease claims (insomnia = medical condition)"
          - "No guarantees (results vary)"
          - "No pharmaceutical comparisons"
        compliance: ["FTC — no false urgency", "CAN-SPAM compliant"]
        brand_donts: ["No hype", "No fear-mongering", "No fake scarcity"]

      tone_controls:
        warmth: 8           # High empathy
        authority: 7        # Credible but not clinical
        humor: 3            # Light touch, not comedy
        urgency: 2          # Evergreen, no pressure
        mystique: 4         # Some intrigue but not manipulative

    MESSAGE_SPINE:
      project_id: "SLEEP_COACH_2024"
      version: "1.0"
      core_promise: "Fall asleep quickly and sleep through the night—naturally—by resetting your sleep architecture"

      mechanism_paragraph_canonical: |
        Most sleep advice addresses symptoms (routines, supplements, apps) but ignores the root cause:
        a dysregulated nervous system stuck in fight-or-flight mode. Your brain can't downshift into
        sleep mode because your nervous system never fully relaxes. The Sleep Recalibration System
        retrains your nervous system to recognize bedtime as a safe state, allowing natural sleep
        architecture to restore itself. This is why it works without pills, perfect routines, or
        endless meditation sessions.

      proof_pillars:
        - "80%+ clients report improved sleep within 7-14 days"
        - "Nervous system science (vagal tone + HRV research)"
        - "Testimonials from 'tried everything' skeptics"

      objection_counters:
        - objection: "I've tried everything"
          counter: "This addresses the root cause (nervous system), not symptoms"
        - objection: "I don't have time for complicated routines"
          counter: "15 minutes before bed, no meditation or apps required"
        - objection: "Will this actually work for me?"
          counter: "If you can follow simple instructions, your nervous system will respond"

      cta_frame:
        primary: "Join the Sleep Recalibration System"
        secondary: "Learn how this system works"
        urgency_if_applicable: "" # Evergreen, no urgency

      taboo_claims_forbidden:
        - "Cures insomnia"
        - "Guaranteed results"
        - "Better than medication"

    EVIDENCE_PACK:
      project_id: "SLEEP_COACH_2024"
      version: "1.0"
      proof_items:
        - id: "PROOF_01"
          type: "testimonial"
          source: "Client survey, verified purchases"
          confidence: "MODERATE"
          summary: "80%+ clients report improved sleep within 7-14 days"
          allowed_claims:
            - "Designed to support better sleep"
            - "Many clients report improvements quickly"
            - "Targets nervous system regulation"
          forbidden_claims:
            - "Guaranteed results"
            - "Works for everyone"
            - "Cures insomnia"

    task: "Create a 3-email welcome sequence for new subscribers to a sleep coaching info product. Focus: relationship-first, deliver quick win, soft offer introduction (no hard sell)."

  # === EXPECTED OUTPUT ===
  expected_output:
    format: "markdown"
    email_count: 3

    structure_per_email:
      - "subject_line"
      - "preview_text"
      - "body"
      - "cta"
      - "ps"

    focus_by_email:
      email_1:
        purpose: "Welcome + orientation + quick delivery"
        tone: "Empathetic, relatable, immediate value"
        cta: "Read welcome guide (soft, no ask)"

      email_2:
        purpose: "Origin story + shared enemy + mechanism preview"
        tone: "Vulnerable, credible, intrigue"
        cta: "Reply with your #1 sleep struggle (engagement)"

      email_3:
        purpose: "Quick win (free technique) + soft offer intro"
        tone: "Helpful, non-pushy, clear path forward"
        cta: "Try the technique + optional: learn about the system"

    quality_benchmarks:
      singular_focus: true  # One idea per email
      relationship_first: true  # No hard sell until trust built
      proof_grounded: true  # Claims backed or attributed
      voice_consistent: true  # Matches tone_controls
      no_fake_urgency: true  # Evergreen, no countdown

  # === PASS CRITERIA (Non-Negotiable) ===
  pass_criteria:
    - "MMA scores all >= 7.0"
    - "3 emails present with complete structure"
    - "Email 1 focuses on welcome/orientation (no sell)"
    - "Email 2 focuses on origin story/mechanism (intrigue)"
    - "Email 3 delivers quick win + soft offer intro"
    - "No fake urgency/scarcity language"
    - "Claims grounded or attributed per EVIDENCE_PACK"
    - "Voice warmth 7-9, authority 6-8, urgency 1-3"
    - "Singular focus maintained (no competing ideas)"

  # === BASELINE SCORES (Established 2025-12-18) ===
  baseline_scores:
    strategy_alignment: 8.5
    clarity_structure: 8.0
    voice_consistency: 8.5
    proof_discipline: 9.0
    neuro_resonance: 8.0
    cta_integrity: 8.0
    ethical_guardrails: 9.5
    average: 8.5

  # === NOTES ===
  notes: |
    This golden run represents an "ideal scenario" for Email Campaign Genius:
    - Clear inputs (PROJECT_BRIEF + MESSAGE_SPINE + EVIDENCE_PACK)
    - Warm audience (relationship-building welcome sequence)
    - Standard structure (3 emails, welcome → story → value)
    - No edge cases or unusual constraints

    Use this to detect regressions in:
    - Core sequencing logic (welcome → intrigue → value)
    - Proof discipline (claims must be grounded)
    - Voice consistency (matching tone_controls)
    - Ethical guardrails (no fake urgency)

  # === REGRESSION TRACKING ===
  regression_history:
    - version: "1.0.0"
      date: "2025-12-18"
      average_score: 8.5
      status: "BASELINE"
      notes: "Initial golden run established"
